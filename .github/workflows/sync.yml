name: Validate Worker and chain proxy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Diagnose production reachability from GitHub
        run: |
          node --input-type=module - <<'JS'
          for (const path of ['/login', '/admin/chain-proxy.json']) {
            try {
              const response = await fetch('https://edgetunnel2pro.1294330981oy.workers.dev' + path, { redirect: 'manual', signal: AbortSignal.timeout(15000) });
              const text = await response.text();
              console.log(JSON.stringify({ path, status: response.status, location: response.headers.get('location'), bytes: Buffer.byteLength(text), login: text.includes('password'), diagnosticCatch: text.includes('Worker runtime failure'), cloudflare1101: text.includes('1101') }));
            } catch (error) { console.log(JSON.stringify({ path, error: error.message, cause: error.cause?.code })); }
          }
          JS
